<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Surplus Food – Food Bridge AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Header Banner -->
  <div class="bg-white border-b border-slate-100 py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 text-xs font-bold text-emerald-600 mb-1">
            <i class="fa-solid fa-utensils"></i> Community Food Distribution
          </div>
          <h1 class="text-3xl font-extrabold text-slate-900 font-outfit">Available Food Donations</h1>
          <p class="text-sm text-slate-500 mt-1">Browse, filter, and request verified surplus food in your locality.</p>
        </div>
        <div class="flex items-center gap-3">
          <a href="/donate" class="btn-primary text-xs sm:text-sm py-2.5 px-5 font-bold">
            <i class="fa-solid fa-circle-plus"></i> Donate Food Now
          </a>
          <a href="/map-view" class="btn-secondary text-xs sm:text-sm py-2.5 px-4 font-bold">
            <i class="fa-solid fa-map-location-dot text-emerald-600"></i> Map View
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content & Filters -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- Filter Control Box -->
    <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm mb-8 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-sliders text-emerald-600"></i>
          <span class="font-bold text-sm text-slate-800">Filter Nearby Food by Locality & Category</span>
        </div>
        <button onclick="resetFilters()" class="text-xs text-slate-400 hover:text-emerald-600 font-semibold transition">
          <i class="fa-solid fa-rotate-left mr-1"></i> Reset Filters
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
        
        <!-- Search Keyword -->
        <div class="lg:col-span-2">
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Search Food</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
            <input type="text" id="filter-search" placeholder="e.g. Rice, Bread, Curry..." 
              class="w-full pl-8 pr-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium">
          </div>
        </div>

        <!-- City Dropdown -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">City</label>
          <select id="filter-city" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium bg-white">
            <option value="">All Cities</option>
          </select>
        </div>

        <!-- Area Dropdown -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Area</label>
          <select id="filter-area" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium bg-white">
            <option value="">All Areas</option>
          </select>
        </div>

        <!-- Category Dropdown -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Category</label>
          <select id="filter-category" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium bg-white">
            <option value="">All Categories</option>
            <option value="Cooked Meals">Cooked Meals</option>
            <option value="Bakery & Bread">Bakery & Bread</option>
            <option value="Fruits & Vegetables">Fruits & Vegetables</option>
            <option value="Packaged Food">Packaged Food</option>
            <option value="Dairy & Beverages">Dairy & Beverages</option>
          </select>
        </div>

        <!-- Quality Dropdown -->
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Quality</label>
          <select id="filter-quality" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium bg-white">
            <option value="">All Qualities</option>
            <option value="Excellent">🟢 Excellent</option>
            <option value="Good">🟡 Good</option>
            <option value="Average">🟠 Average</option>
            <option value="Poor">🔴 Poor</option>
          </select>
        </div>

      </div>

      <!-- Quick Category Chips -->
      <div class="flex items-center gap-2 pt-1 flex-wrap">
        <span class="text-[11px] font-bold text-slate-400">Quick Filter:</span>
        <button onclick="setCategoryFilter('')" class="category-chip px-3 py-1 rounded-full text-xs font-semibold bg-emerald-600 text-white">All</button>
        <button onclick="setCategoryFilter('Cooked Meals')" class="category-chip px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">🍱 Cooked Meals</button>
        <button onclick="setCategoryFilter('Bakery & Bread')" class="category-chip px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">🍞 Bakery & Bread</button>
        <button onclick="setCategoryFilter('Fruits & Vegetables')" class="category-chip px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">🍎 Fresh Produce</button>
        <button onclick="setCategoryFilter('Dairy & Beverages')" class="category-chip px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">🥛 Dairy & Soup</button>
      </div>
    </div>

    <!-- Active Count & Sort -->
    <div class="flex items-center justify-between mb-6">
      <p class="text-xs sm:text-sm font-semibold text-slate-600">
        Showing <span id="donations-count" class="font-bold text-emerald-600">0</span> verified food donations
      </p>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-slate-400 font-medium">Status:</span>
        <select id="filter-status" onchange="loadDonations()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 font-semibold text-slate-700 focus:outline-none">
          <option value="Available">Available Only</option>
          <option value="all">All (Available & Reserved)</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="donations-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Loading Skeleton -->
      <div class="h-96 bg-slate-100 animate-pulse rounded-2xl"></div>
      <div class="h-96 bg-slate-100 animate-pulse rounded-2xl"></div>
      <div class="h-96 bg-slate-100 animate-pulse rounded-2xl"></div>
    </div>

  </div>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/assets/app.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script>
    let currentDonations = [];

    async function loadDonations() {
      const city = document.getElementById("filter-city").value;
      const area = document.getElementById("filter-area").value;
      const category = document.getElementById("filter-category").value;
      const quality = document.getElementById("filter-quality").value;
      const search = document.getElementById("filter-search").value;
      const status = document.getElementById("filter-status").value;

      const params = new URLSearchParams();
      if (city) params.append("city", city);
      if (area) params.append("area", area);
      if (category) params.append("category", category);
      if (quality) params.append("quality", quality);
      if (search) params.append("search", search);
      if (status) params.append("status", status);

      try {
        const res = await fetch(`/api/donations?${params.toString()}`);
        const data = await res.json();
        const container = document.getElementById("donations-container");
        const countEl = document.getElementById("donations-count");

        if (data.success) {
          currentDonations = data.donations;
          countEl.textContent = data.donations.length;

          if (data.donations.length === 0) {
            container.innerHTML = `
              <div class="col-span-full py-16 text-center bg-white rounded-3xl border border-slate-100 p-8 shadow-sm">
                <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mx-auto mb-3">
                  <i class="fa-solid fa-plate-wheat"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-800">No Food Donations Found</h3>
                <p class="text-xs text-slate-500 max-w-md mx-auto mt-1 mb-4">
                  No surplus donations currently match your selected filters. Try broadening your location or category filter.
                </p>
                <button onclick="resetFilters()" class="btn-primary text-xs py-2 px-5 font-bold">Reset Filters</button>
              </div>
            `;
            return;
          }

          container.innerHTML = data.donations.map(d => {
            const qualityClass = d.quality === 'Excellent' ? 'badge-quality-excellent' :
                                 d.quality === 'Good' ? 'badge-quality-good' :
                                 d.quality === 'Average' ? 'badge-quality-average' : 'badge-quality-poor';

            const qualityIcon = d.quality === 'Excellent' ? '🟢' :
                                d.quality === 'Good' ? '🟡' :
                                d.quality === 'Average' ? '🟠' : '🔴';

            const isAvailable = d.status === 'Available';
            const statusBadge = isAvailable ? 
              `<span class="bg-emerald-100 text-emerald-800 font-extrabold text-[10px] px-2 py-0.5 rounded-full uppercase">Available</span>` :
              `<span class="bg-amber-100 text-amber-800 font-extrabold text-[10px] px-2 py-0.5 rounded-full uppercase">${d.status}</span>`;

            return `
              <div class="fb-card overflow-hidden flex flex-col justify-between">
                <div>
                  <!-- Card Header & Image -->
                  <div class="relative h-48 overflow-hidden bg-slate-100">
                    <img src="${d.image_url}" alt="${d.food_name}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent"></div>
                    
                    <span class="absolute top-3 left-3 ${qualityClass} shadow-md">
                      ${qualityIcon} ${d.quality} Quality
                    </span>

                    <span class="absolute top-3 right-3 bg-white/95 px-2.5 py-1 rounded-full text-[11px] font-extrabold text-slate-800 shadow-md">
                      ${d.category}
                    </span>

                    <div class="absolute bottom-2 left-3 right-3 flex items-center justify-between text-white text-xs">
                      <span class="font-bold flex items-center gap-1">
                        <i class="fa-solid fa-route text-amber-300"></i> ${d.distance_formatted}
                      </span>
                      ${statusBadge}
                    </div>
                  </div>

                  <!-- Details Body -->
                  <div class="p-5 space-y-3">
                    <div>
                      <h3 class="font-bold text-lg text-slate-900 leading-snug">${d.food_name}</h3>
                      <p class="text-xs text-slate-500 mt-1 line-clamp-2">${d.description || 'Hygienically prepared surplus food ready for immediate redistribution.'}</p>
                    </div>

                    <!-- Quantity & Expiry Badges -->
                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs">
                      <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">Quantity</span>
                        <span class="font-extrabold text-slate-800 text-sm text-emerald-700">
                          🍱 ${d.quantity} ${d.unit}
                        </span>
                      </div>
                      <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">Safe Until</span>
                        <span class="font-bold text-slate-800 text-xs text-amber-700 flex items-center gap-1 mt-0.5">
                          <i class="fa-regular fa-clock"></i> ${d.expiry_time ? d.expiry_time.slice(5, 16) : 'Today'}
                        </span>
                      </div>
                    </div>

                    <!-- Readable Location (No Lat/Long!) -->
                    <div class="space-y-1 text-xs">
                      <div class="flex items-start gap-2 text-slate-700">
                        <i class="fa-solid fa-location-dot text-emerald-600 mt-0.5"></i>
                        <div>
                          <strong class="font-bold text-slate-900">${d.city} &rarr; ${d.area}</strong>
                          <p class="text-slate-500 text-[11px] font-medium">${d.colony} (${d.address})</p>
                        </div>
                      </div>

                      <div class="flex items-center gap-2 text-slate-500 text-[11px] pt-1 border-t border-slate-100">
                        <i class="fa-solid fa-building-user text-slate-400"></i>
                        <span>Donor: <strong>${d.donor_name}</strong></span>
                      </div>
                    </div>

                    <!-- AI Recommended Match Reason Note -->
                    ${d.ai_recommendation_reason ? `
                      <div class="p-2.5 rounded-xl bg-emerald-50/70 border border-emerald-100 text-[11px] text-emerald-900 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-emerald-600"></i>
                        <span class="line-clamp-1 font-medium">${d.ai_recommendation_reason}</span>
                      </div>
                    ` : ''}

                  </div>
                </div>

                <!-- Action Button -->
                <div class="p-5 pt-0">
                  ${isAvailable ? `
                    <button onclick="openRequestModal(${d.id}, '${d.food_name.replace(/'/g, "\\'")}', ${d.quantity}, '${d.unit}', '${d.city} &rarr; ${d.area} &rarr; ${d.colony}')" 
                      class="btn-primary w-full text-xs font-bold py-2.5 shadow-md">
                      <i class="fa-solid fa-hand-holding-heart text-amber-300"></i> Request Food
                    </button>
                  ` : `
                    <button disabled class="w-full bg-slate-200 text-slate-500 py-2.5 rounded-full text-xs font-bold cursor-not-allowed">
                      <i class="fa-solid fa-lock mr-1"></i> Food Already Reserved
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join("");
        }
      } catch (err) {
        console.error("Error loading donations:", err);
      }
    }

    function setCategoryFilter(cat) {
      document.getElementById("filter-category").value = cat;
      // Update chip styling
      document.querySelectorAll(".category-chip").forEach(chip => {
        if (chip.textContent.includes(cat) || (cat === '' && chip.textContent === 'All')) {
          chip.className = "category-chip px-3 py-1 rounded-full text-xs font-semibold bg-emerald-600 text-white";
        } else {
          chip.className = "category-chip px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700";
        }
      });
      loadDonations();
    }

    function resetFilters() {
      document.getElementById("filter-city").value = "";
      document.getElementById("filter-area").value = "";
      document.getElementById("filter-category").value = "";
      document.getElementById("filter-quality").value = "";
      document.getElementById("filter-search").value = "";
      document.getElementById("filter-status").value = "Available";
      setCategoryFilter("");
      loadDonations();
    }

    function reloadFoodCards() {
      loadDonations();
    }

    document.addEventListener("DOMContentLoaded", async () => {
      // Setup location hierarchy in filters
      try {
        const res = await fetch("/api/locations/hierarchy");
        const data = await res.json();
        if (data.success) {
          const h = data.hierarchy;
          const cityEl = document.getElementById("filter-city");
          const areaEl = document.getElementById("filter-area");

          cityEl.innerHTML = `<option value="">All Cities</option>` + Object.keys(h).map(c => `<option value="${c}">${c}</option>`).join("");
          
          cityEl.addEventListener("change", () => {
            const selected = cityEl.value;
            if (selected && h[selected]) {
              areaEl.innerHTML = `<option value="">All Areas</option>` + Object.keys(h[selected]).map(a => `<option value="${a}">${a}</option>`).join("");
            } else {
              areaEl.innerHTML = `<option value="">All Areas</option>`;
            }
            loadDonations();
          });

          areaEl.addEventListener("change", loadDonations);
        }
      } catch (e) {
        console.warn(e);
      }

      // Event listeners for filters
      document.getElementById("filter-category").addEventListener("change", loadDonations);
      document.getElementById("filter-quality").addEventListener("change", loadDonations);
      
      let searchTimeout;
      document.getElementById("filter-search").addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadDonations, 300);
      });

      loadDonations();
    });
  </script>
</body>
</html>
